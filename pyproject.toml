[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-harness"
version = "1.1.0"  # 版本升级：引入按需加载 Skill 机制与增强日志
description = "轻量级多智能体编排框架 — 驾驭 AI 的工程化实践"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "DakeGinger", email = "dakeginger@qq.com" }
]
keywords = ["llm", "agent", "mcp", "langchain", "fastapi", "multimodal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖：保持极致轻量，只包含运行基础 Agent 和 API 服务的必备库
dependencies = [
    # 核心框架
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    
    # API 服务
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    
    # 基础配置与工具（BashSkill/FileSkill 不需要额外第三方库）
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "jieba>=0.42.1",          # 关键词提取工具需要
]

# 可选依赖：按需安装，避免撑爆用户环境
[project.optional-dependencies]
# 图像处理 (对应 ImageSkill)
vision = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

# 视频处理 (对应 VideoSkill)
video = [
    "opencv-python>=4.9.0",
]

# 音频处理 (对应 AudioSkill)
audio = [
    "pydub>=0.25.1",
    "SpeechRecognition>=3.10.0",
]

# 高性能文本匹配 (用于违禁词检测)
fast-text = [
    "pyahocorasick>=2.1.0",
]

# 一键全量安装 (包含所有多模态和加速能力)
full = [
    "nano-harness[vision,video,audio,fast-text]",
]

# 开发与测试依赖
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
# 安装后，在终端敲 `nano-harness` 即可启动 main.py 里的 main() 函数
nano-harness = "main:main"

[project.urls]
Homepage = "https://github.com/DakeGinger/nano-harness"
Repository = "https://github.com/DakeGinger/nano-harness.git"

[tool.setuptools.packages.find]
# 指定搜索的包目录，因为你的主包是 nano_harness
include = ["nano_harness*"]

# ==========================
# 工具链配置 
# ==========================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",    # 行长度超限交由 formatter 处理
    "B008",    # 允许 FastAPI 的 Depends() 等默认参数调用
    "RUF001",  # 允许中文注释中的全角标点
    "RUF002",  # 允许 Docstring 中的全角标点
    "RUF003",  # 允许注释中的全角标点
    "E402",    # 模块导入不在顶部（延迟导入机制）
    "RUF012",  # 允许类属性中的可变默认值（我们在某些配置类中使用了）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用 print/未使用的变量等测试常规操作
"tests/**/*" = ["F841", "F401", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"  # 增加：配合 pytest-asyncio，让异步测试直接运行
