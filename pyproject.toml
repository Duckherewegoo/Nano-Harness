[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-harness"
version = "1.0.0"
description = "轻量级多智能体编排框架 — 驾驭 AI 的工程化实践"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "DakeGinger", email = "dakeginger@qq.com" }
]
keywords = ["llm", "agent", "mcp", "langchain", "fastapi", "multimodal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 核心框架
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    
    # API 服务
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    
    # 多模态处理 - 图片
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    
    # 多模态处理 - 视频
    "opencv-python>=4.9.0",
    
    # 多模态处理 - 音频
    "pydub>=0.25.1",
    "SpeechRecognition>=3.10.0",
    
    # 配置文件与工具库
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
# 安装后，在终端敲 `nano-harness` 即可启动 main.py 里的 main() 函数
nano-harness = "main:main"

[project.urls]
Homepage = "https://github.com/DakeGinger/nano-harness"
Repository = "https://github.com/DakeGinger/nano-harness.git"

[tool.setuptools.packages.find]
# 指定搜索的包目录，因为你的主包是 nano_harness
include = ["nano_harness*"]

# ==========================
# 工具链配置 (严谨克制版)
# ==========================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",    # 行长度超限交由 formatter 处理
    "B008",    # 允许 FastAPI 的 Depends() 或 Typer/Gradio 的默认参数调用
    "RUF001",  # 允许中文注释中的全角标点
    "RUF002",  # 允许 Docstring 中的全角标点
    "RUF003",  # 允许注释中的全角标点
    "E402",   # 模块导入不在顶部（日志初始化导致）
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用 print/未使用的变量等测试常规操作
"tests/**/*" = ["F841", "F401", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
